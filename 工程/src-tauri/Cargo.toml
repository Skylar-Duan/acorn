[package]
name = "acorn"
version = "1.13.0"
description = "橡果 Acorn · 温暖纸感的待办工具"
authors = ["cdpandas"]
edition = "2021"

[lib]
name = "acorn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# 拉起「用系统方式打开这个文件/链接」：桌面「改用浏览器下载」和外链走它。安卓上它开不了本地文件（只认 URL），
# APK 交给系统安装器走的是 App 自己的 InstallPlugin（gen/android 里的 .kt + lib.rs 的 install_apk）
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
