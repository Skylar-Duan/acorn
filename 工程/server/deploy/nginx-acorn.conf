# acorn.cdpandas.com —— 橡果云同步服务
#
# 独立 server 块，**不碰**这台机器上任何已有站点的配置（finance / sbg / osmoeng / petlink）。
# DNS 不用配：cdpandas.com 有一条 *.cdpandas.com → 本机 的通配符 A 记录。
# 证书由 certbot 单独给这个域名签（照 osmoeng 的做法）。

# 防爆破：注册/登录这类写接口按 IP 限速，同步接口放宽
limit_req_zone $binary_remote_addr zone=acorn_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=acorn_sync:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name acorn.cdpandas.com;

    # certbot 续期用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 本机 nginx 是 1.24，只认这种写法；`http2 on;` 是 1.25.1 才有的，别改
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acorn.cdpandas.com;

    ssl_certificate     /etc/letsencrypt/live/acorn.cdpandas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acorn.cdpandas.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 一份数据最大 5MB，留点余量
    client_max_body_size 8m;

    access_log /var/log/nginx/acorn-access.log;
    error_log  /var/log/nginx/acorn-error.log;

    # 安装包（android/ 是 APK，windows/ 是桌面 exe）。橡果自己来这儿下，不用人去网页找。
    # 公开可下（安装包本来就是给人装的），但只有这一个目录，且不列目录树。
    location /download/ {
        # 放 /var/www 而不是 /var/lib/acorn-sync：后者是 750 归 acorn，
        # nginx 连目录都进不去，直链会 403（2026-08-24 踩过）
        alias /var/www/acorn-public/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
        # 橡果是在 webview 里用 fetch 把包拉下来的（tauri.localhost 源），跨源请求没有这几个头
        # 浏览器内核直接拒收，界面上只剩一句「Failed to fetch」（2026-09-02 用户第一次点更新就撞上）。
        # /api/ 那边是 FastAPI 的 CORS 中间件在给，静态目录得 nginx 自己给。
        # Expose-Headers 让前端读得到 Content-Length，进度条才有分母。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        # 带 Range 之类头的请求会先发 OPTIONS 预检，静态文件默认回 405，预检就挂了——直接 204 放行
        if ($request_method = OPTIONS) { return 204; }
        # 让下载器认得出是安装包，而不是当成文本打开
        types {
            application/vnd.android.package-archive apk;
            application/x-msdownload exe;
            application/json json;
        }
        default_type application/octet-stream;
    }

    location /api/auth/ {
        limit_req zone=acorn_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    location /api/ {
        limit_req zone=acorn_sync burst=40 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    # 根路径 / /assets/ /utilities/ 是介绍页（10-Platform 管，片段文件在 10 的 finance/nginx/acorn-site.inc，
    # 用它的 deploy_acorn_site.py 推）。2026-09-02 橡果独立成 acorn.cdpandas.com 后加的；
    # deploy.sh 会整份覆盖 acorn.conf，所以这一行必须留在仓库里，否则一发布服务端就把介绍页冲掉。
    include /etc/nginx/acorn-site.inc;

    location / {
        return 404;
    }
}
