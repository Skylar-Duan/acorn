# acorn.cdpandas.com —— 橡果云同步服务
#
# 独立 server 块，**不碰**这台机器上任何已有站点的配置（finance / sbg / osmoeng / petlink）。
# DNS 不用配：cdpandas.com 有一条 *.cdpandas.com → 本机 的通配符 A 记录。
# 证书由 certbot 单独给这个域名签（照 osmoeng 的做法）。

# 防爆破：注册/登录这类写接口按 IP 限速，同步接口放宽
limit_req_zone $binary_remote_addr zone=acorn_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=acorn_sync:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name acorn.cdpandas.com;

    # certbot 续期用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 本机 nginx 是 1.24，只认这种写法；`http2 on;` 是 1.25.1 才有的，别改
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acorn.cdpandas.com;

    ssl_certificate     /etc/letsencrypt/live/acorn.cdpandas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acorn.cdpandas.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 一份数据最大 5MB，留点余量
    client_max_body_size 8m;

    access_log /var/log/nginx/acorn-access.log;
    error_log  /var/log/nginx/acorn-error.log;

    # 安装包（android/ 是 APK，windows/ 是桌面 exe）。橡果自己来这儿下，不用人去网页找。
    # 公开可下（安装包本来就是给人装的），但只有这一个目录，且不列目录树。
    location /download/ {
        # 放 /var/www 而不是 /var/lib/acorn-sync：后者是 750 归 acorn，
        # nginx 连目录都进不去，直链会 403（2026-08-24 踩过）
        alias /var/www/acorn-public/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
        # 橡果是在 webview 里用 fetch 把包拉下来的（tauri.localhost 源），跨源请求没有这几个头
        # 浏览器内核直接拒收，界面上只剩一句「Failed to fetch」（2026-09-02 用户第一次点更新就撞上）。
        # /api/ 那边是 FastAPI 的 CORS 中间件在给，静态目录得 nginx 自己给。
        # Expose-Headers 让前端读得到 Content-Length，进度条才有分母。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        # 带 Range 之类头的请求会先发 OPTIONS 预检，静态文件默认回 405，预检就挂了——直接 204 放行
        if ($request_method = OPTIONS) { return 204; }
        # 让下载器认得出是安装包，而不是当成文本打开
        types {
            application/vnd.android.package-archive apk;
            application/x-msdownload exe;
            application/json json;
        }
        default_type application/octet-stream;
    }

    # ---- 网页版（v1.15.0 起）。浏览器打开就是橡果本体，不是介绍页。 ----
    # 产物由 server/deploy/publish-web.sh 传到 /var/www/acorn-web/。
    # 2026-09-21 起网页版挂在根路径 /（原来在 /app/），介绍页挪到 /intro/（10-Platform 管，
    # 在下面 include 的 acorn-site.inc 里）。地址规划：
    #   /  /assets/  /icons/  /manifest.webmanifest  /version.json  /index.html   网页版（本文件）
    #   /app  /app/*                                                              301 → /  /$1（本文件）
    #   /api/  /download/                                                          更新 / 同步服务（本文件）
    #   /intro  /intro/  /intro/assets/  /utilities/                                介绍页（acorn-site.inc，10 管）
    # ⛔ 本文件里别写 /intro、/utilities 开头的 location：跟 acorn-site.inc 重复定义，
    #    nginx -t 不过，整台机器其它站的 reload 一起卡住。

    # 旧地址 /app/ 的书签、「加到主屏幕」的旧图标都还指着这儿，永久跳到根路径上的同一处。
    # （manifest 里的 "id" 故意还是 "/app/"，安卓认的是这个 id，不改它已装的就不会变成两个。）
    location = /app {
        return 301 /;
    }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 permanent;
    }

    # 带指纹的静态资源（文件名里有 hash，内容一变文件名就变）——可以放心让浏览器永久缓存。
    # 字体那两个各 1.1 MB，缓不住的话每次打开都要重下一遍，手机流量疼。
    # ^~ 让它压过收尾那条 location / 。
    location ^~ /assets/ {
        alias /var/www/acorn-web/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header 在 location 里是**整组覆盖**父级的，不是追加——
        # 这两条安全头得在每个写了 add_header 的 location 里重新写一遍，否则就没了
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 图标文件名不带 hash，换图标时得能换掉，所以只缓一天
    location ^~ /icons/ {
        alias /var/www/acorn-web/icons/;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 清单短缓存：改了图标 / 名字，一小时内生效就行
    location = /manifest.webmanifest {
        root /var/www/acorn-web;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        # nginx 自带的 mime.types 里没有 webmanifest，不补这一条会当 text/plain 发出去，
        # Safari 直接不认这份清单，「添加到主屏幕」就退化成普通网页书签
        types {
            application/manifest+json webmanifest;
            application/json          json;
            text/html                 html;
            text/css                  css;
            application/javascript    js;
            font/woff2                woff2;
            image/png                 png;
            image/svg+xml             svg;
        }
        default_type application/octet-stream;
    }

    location /api/auth/ {
        limit_req zone=acorn_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    location /api/ {
        limit_req zone=acorn_sync burst=40 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    # 介绍页 /intro/ 和共用样式 /utilities/ 归 10-Platform 管（片段文件在 10 的
    # finance/nginx/acorn-site.inc，用它的 deploy_acorn_site.py 推）。
    # 发布脚本会整份覆盖 acorn.conf，所以这一行必须留在仓库里，否则一发布服务端就把介绍页冲掉。
    include /etc/nginx/acorn-site.inc;

    # 网页版本体（根路径）。前面那些 location 都没接住的，全落到这里。
    location / {
        root /var/www/acorn-web;
        index index.html;
        # 单页应用：认不出来的路径都回 index.html，由前端自己决定显示什么。
        # 回落写成 /index.html 而不是 =404，是为了「加到主屏幕」之后系统可能从
        # 某个子路径重新打开它，那时候不能给人一个 404。
        try_files $uri $uri/ /index.html;
        # index.html 和 version.json 绝不能缓存：缓住了就是「发了新版用户还看老的」。
        # 真正大的那几个文件在 /assets/ 那条 location 里，永久缓存，这里 no-cache 不心疼。
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        # nginx 自带的 mime.types 里没有 webmanifest，不补这一条会当 text/plain 发出去，
        # Safari 直接不认这份清单，「添加到主屏幕」就退化成普通网页书签
        types {
            application/manifest+json webmanifest;
            application/json          json;
            text/html                 html;
            text/css                  css;
            application/javascript    js;
            font/woff2                woff2;
            image/png                 png;
            image/svg+xml             svg;
        }
        default_type application/octet-stream;
    }
}
