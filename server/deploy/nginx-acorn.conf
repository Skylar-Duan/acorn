# acorn.cdpandas.com —— 橡果云同步服务
#
# 独立 server 块，**不碰**这台机器上任何已有站点的配置（finance / sbg / osmoeng / petlink）。
# DNS 不用配：cdpandas.com 有一条 *.cdpandas.com → 本机 的通配符 A 记录。
# 证书由 certbot 单独给这个域名签（照 osmoeng 的做法）。

# 防爆破：注册/登录这类写接口按 IP 限速，同步接口放宽
limit_req_zone $binary_remote_addr zone=acorn_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=acorn_sync:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name acorn.cdpandas.com;

    # certbot 续期用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 本机 nginx 是 1.24，只认这种写法；`http2 on;` 是 1.25.1 才有的，别改
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acorn.cdpandas.com;

    ssl_certificate     /etc/letsencrypt/live/acorn.cdpandas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acorn.cdpandas.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 一份数据最大 5MB，留点余量
    client_max_body_size 8m;

    access_log /var/log/nginx/acorn-access.log;
    error_log  /var/log/nginx/acorn-error.log;

    location = / {
        default_type text/plain;
        return 200 "acorn sync service\n";
    }

    location /api/auth/ {
        limit_req zone=acorn_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    location /api/ {
        limit_req zone=acorn_sync burst=40 nodelay;
        proxy_pass http://127.0.0.1:8021;
        include /etc/nginx/proxy_params_acorn;
    }

    location / {
        return 404;
    }
}
